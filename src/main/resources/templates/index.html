<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>意思決定アナライザー</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .section-box {
      border-radius: 10px;
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #dee2e6;
      margin-bottom: 25px;
    }
    .score-label { font-size: 0.9rem; font-weight: bold; }
  </style>
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white py-3">
      <h2 class="h4 mb-0">論理的意思決定サポーター</h2>
    </div>

    <div class="card-body">
      <div class="row">
        <div class="col-md-5">

          <div class="section-box">
            <h5 class="mb-3">分析対象</h5>
            <div id="decisionInfo" class="alert alert-info d-flex justify-content-between align-items-center">
              <span id="decisionTitleText" class="fw-bold">読み込み中...</span>
              <button class="btn btn-sm btn-outline-primary" onclick="editDecisionTitle()">変更</button>
            </div>
          </div>

          <div class="section-box">
            <h5 class="border-bottom pb-2">分析項目の設定</h5>
            <table class="table table-sm align-middle mt-2">
              <thead>
              <tr><th>項目名</th><th>重み</th><th>操作</th></tr>
              </thead>
              <tbody id="criteriaTable"></tbody>
            </table>
            <div class="input-group input-group-sm">
              <input type="text" id="newCritName" class="form-control" placeholder="将来性 など">
              <input type="number" id="newCritWeight" class="form-control" step="0.1" value="0.5" style="max-width: 70px;">
              <button class="btn btn-primary" onclick="addCriterion()">追加</button>
            </div>
          </div>

          <div class="section-box shadow-sm border-primary">
            <h5 class="text-primary mb-3">スコア入力</h5>
            <form id="evaluationForm">
              <div class="mb-3">
                <label class="form-label small fw-bold">評価する対象</label>
                <select class="form-select border-primary" id="targetAlternative"></select>
              </div>
              <div id="scoreInputs" class="bg-light p-2 rounded">
              </div>
              <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-success">分析結果を保存</button>
                <button type="button" class="btn btn-link btn-sm text-danger" onclick="resetScores()">全スコアをリセット</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-md-7">
          <div class="section-box">
            <h5 class="border-bottom pb-2">分析結果（レーダーチャート）</h5>
            <canvas id="resultChart" class="mt-3"></canvas>
          </div>

          <div class="section-box">
            <h5 class="border-bottom pb-2">総合ランキング</h5>
            <div id="rankingTable" class="list-group mt-2 shadow-sm">
            </div>
          </div>

          <div class="section-box">
            <h5 class="border-bottom pb-2">評価対象の管理</h5>
            <ul id="alternativeList" class="list-group list-group-flush mb-3"></ul>
            <div class="input-group input-group-sm">
              <input type="text" id="newAltName" class="form-control" placeholder="新しい候補（C社など）">
              <button class="btn btn-outline-success" onclick="addAlternative()">追加</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // 1. データの読み込み・画面の初期化
  // ==========================================

  /** サーバーから最新の意思決定データを取得し、各UIコンポーネントを更新するメイン関数 */
  async function loadChart() {
    try {
      const resBase = await fetch('/api/decisions/1');
      const decision = await resBase.json();

      // 分析タイトルの表示
      document.getElementById('decisionTitleText').innerText = "「" + decision.title + "」を分析中";

      // 分析項目テーブルの描画
      document.getElementById('criteriaTable').innerHTML = decision.criteria.map(crit => `
        <tr>
          <td>${crit.name}</td>
          <td>${crit.weight}</td>
          <td><button class="btn btn-sm btn-link text-danger" onclick="deleteCriterion(${crit.id})">削除</button></td>
        </tr>
      `).join('');

      // 評価対象リスト（管理用）の描画
      document.getElementById('alternativeList').innerHTML = decision.alternatives.map(alt => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${alt.name}
          <div>
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="editAlternative(${alt.id}, '${alt.name}')">名変</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteAlternative(${alt.id})">削除</button>
          </div>
        </li>
      `).join('');

      // 評価対象選択用のプルダウン生成
      document.getElementById('targetAlternative').innerHTML = decision.alternatives.map(alt =>
              `<option value="${alt.id}">${alt.name}</option>`
      ).join('');

      // 数値入力形式のスコア入力フィールド生成
      document.getElementById('scoreInputs').innerHTML = decision.criteria.map(crit => `
        <div class="row g-2 align-items-center mb-2">
          <div class="col-8">
            <label class="score-label">${crit.name}</label>
          </div>
          <div class="col-4">
            <input type="number" class="form-control form-control-sm score-input text-center"
                   data-crit-id="${crit.id}" min="1" max="10" value="5">
          </div>
        </div>
      `).join('');

      // 計算結果を取得してグラフとランキングを更新
      const resResult = await fetch('/api/decisions/1/result');
      const resultData = await resResult.json();

      drawRadarChart(resultData);
      updateRankingList(resultData.rankings);

    } catch (e) { console.error("読み込みエラー:", e); }
  }


  // 分析結果の表示（ランキング）
  /** スコア計算結果に基づいてランキング表を生成・表示する */
  function updateRankingList(rankings) {
    if(!rankings) return;
    const rankingEntries = Object.entries(rankings).sort((a, b) => b[1] - a[1]);
    document.getElementById('rankingTable').innerHTML = rankingEntries.map(([name, score], index) => `
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <span><strong>${index + 1}.</strong> ${name}</span>
        <span class="badge bg-secondary rounded-pill">${score} 点</span>
      </div>
    `).join('');
  }

  //分析テーマ（タイトル）の操作
  /** 意思決定全体のタイトル（例：転職先の比較）を編集する */
  async function editDecisionTitle() {
    const current = document.getElementById('decisionTitleText').innerText.replace("「", "").replace("」を分析中", "");
    const next = prompt("新しいタイトル", current);
    if (!next || next === current) return;
    await fetch('/api/decisions/1', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: next })
    });
    location.reload();
  }

  //  評価対象（選択肢）の操作
  /** 既存の評価対象（会社名など）の名称を変更する */
  async function editAlternative(id, old) {
    const next = prompt("新しい名称", old);
    if (!next || next === old) return;
    await fetch(`/api/decisions/alternatives/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: next })
    });
    location.reload();
  }

  /** 新しい評価対象をリストに追加する */
  async function addAlternative() {
    const name = document.getElementById('newAltName').value;
    if(!name) return;
    await fetch('/api/decisions/1/alternatives', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    location.reload();
  }

  /** 指定した評価対象をリストから削除する */
  async function deleteAlternative(id) {
    if(!confirm("削除しますか？")) return;
    await fetch(`/api/decisions/alternatives/${id}`, { method: 'DELETE' });
    location.reload();
  }

  // 分析項目の操作
  /** 新しい分析項目（例：年収）と、その重み付けを追加する */
  async function addCriterion() {
    const name = document.getElementById('newCritName').value;
    const weight = document.getElementById('newCritWeight').value;
    if(!name || !weight) return;
    await fetch('/api/decisions/1/criteria', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, weight: parseFloat(weight) })
    });
    location.reload();
  }

  /** 指定した分析項目を削除する */
  async function deleteCriterion(id) {
    if(!confirm("削除しますか？")) return;
    await fetch(`/api/decisions/criteria/${id}`, { method: 'DELETE' });
    location.reload();
  }

  // スコア（点数）の操作
  /** 現在入力されているすべてのスコアデータを一括削除する（リセット） */
  async function resetScores() {
    if (!confirm("すべてのスコアを削除しますか？")) return;
    await fetch('/api/decisions/1/evaluations', { method: 'DELETE' });
    location.reload();
  }

  /** フォームに入力されたスコアデータを収集し、サーバーへ保存する */
  document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = Array.from(document.querySelectorAll('.score-input')).map(input => ({
      alternativeId: document.getElementById('targetAlternative').value,
      criterionId: input.dataset.critId,
      score: input.value
    }));
    await fetch('/api/decisions/evaluations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    location.reload();
  });

  // 視覚化（グラフ描画）
  /** Chart.jsを使用して、取得したデータに基づきレーダーチャートを描画する */
  function drawRadarChart(resultData) {
    const colors = [
      { border: 'rgba(54, 162, 235, 1)', bg: 'rgba(54, 162, 235, 0.2)' },
      { border: 'rgba(255, 99, 132, 1)', bg: 'rgba(255, 99, 132, 0.2)' },
      { border: 'rgba(75, 192, 192, 1)', bg: 'rgba(75, 192, 192, 0.2)' }
    ];
    const datasets = Object.keys(resultData.companies).map((name, index) => {
      const color = colors[index % colors.length];
      return {
        label: name,
        data: resultData.companies[name],
        backgroundColor: color.bg,
        borderColor: color.border,
        fill: true,
      };
    });
    const ctx = document.getElementById('resultChart').getContext('2d');
    if (window.myChart) { window.myChart.destroy(); }
    window.myChart = new Chart(ctx, {
      type: 'radar',
      data: { labels: resultData.labels, datasets: datasets },
      options: { scales: { r: { min: 0, max: 10, ticks: { stepSize: 2 } } } }
    });
  }

  // 初期ロードの実行
  loadChart();
</script>

</body>
</html>
